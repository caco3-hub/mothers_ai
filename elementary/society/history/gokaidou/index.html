<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五街道クイズ｜お母さんの愛AI</title>
<style>
:root{--sea:#d6ecfa;--ink:#1d3557;--ok:#2a9d5c;--ng:#ef8a1f;--sun:#ffd23f;--stamp:#e63946}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;color:var(--ink);background-color:var(--sea);
background-image:linear-gradient(rgba(29,53,87,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(29,53,87,.08) 1px,transparent 1px);background-size:32px 32px;min-height:100vh;padding:16px;line-height:1.6}
main{max-width:560px;margin:0 auto}
h1{font-size:1.5rem;margin:8px 0 14px;text-align:center}
h1 span{display:inline-block;background:var(--sun);border:3px solid var(--ink);border-radius:14px;padding:2px 12px;box-shadow:0 4px 0 var(--ink)}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--ink)}
.notice{background:#fff7cc;border:3px dashed var(--ink);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
.go{display:block;width:100%;background:var(--stamp);color:#fff;font-weight:700;font-size:1.2rem;padding:14px;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.go.sub{background:var(--sun);color:var(--ink);margin-top:12px}
.go:active,.judge button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
:focus-visible{outline:4px solid var(--stamp);outline-offset:3px}
.bar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
.score{background:var(--ok);color:#fff;border-radius:999px;padding:0 12px}
.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:0 12px;font-size:.9rem;font-weight:700}
.map{display:block;width:100%;height:auto;margin:10px 0;border:3px solid var(--ink);border-radius:16px;background:var(--sea)}
.q{font-size:1.35rem;font-weight:700;margin:10px 0;line-height:1.5}
.write{text-align:center;font-weight:700;background:#eaf5ff;border:2px solid var(--ink);border-radius:14px;padding:8px;margin:12px 0}
.ans{text-align:center;margin:0 0 14px;padding:14px;border:3px solid var(--ok);border-radius:16px;background:#eafaf1}
.ans small{display:block;font-weight:700}
.ans .a{font-size:1.7rem;font-weight:700;line-height:1.4}
.ans .n{font-size:.95rem;margin-top:6px}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.judge button{font-weight:700;font-size:1.2rem;padding:14px 6px;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.judge .ok{background:var(--ok);color:#fff}.judge .ng{background:var(--ng);color:#fff}
.big{font-size:3rem;font-weight:700;text-align:center;line-height:1.2;margin:4px 0}.big small{font-size:1.2rem}
.msg{text-align:center;font-weight:700;margin:0 0 12px}
.miss{margin:12px 0;padding:0;list-style:none}
.miss li{background:#fff4e0;border:2px solid var(--ng);border-radius:12px;padding:6px 12px;margin-bottom:8px;font-size:.95rem}
.note{font-size:.9rem;text-align:center;margin:12px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1><span>五街道クイズ</span></h1>

<section id="start" class="card">
  <div class="notice">✏️ ノートと えんぴつを用意してね。<br>答えは、このアプリには入力しないで、<b>自分のノートに書く</b>よ。</div>
  <p>江戸時代の「五街道」の問題だよ。<br>前半は、地図の①〜⑤の街道の名前を答える問題。後半は、中学入試によく出る五街道の問題だよ。</p>
  <p>答えを見たら、自分で「正解」か「不正解」をえらぼう。不正解だった問題は、あとでもう一度チャレンジできるよ。</p>
  <button class="go" id="startBtn">スタート</button>
  <p class="note">地図は、位置関係をつかむための略図(りゃくず)だよ。</p>
</section>

<section id="quiz" class="card" hidden>
  <div class="bar"><span id="prog"></span><span class="score" id="score"></span></div>
  <span class="tag" id="tag"></span>
  <div id="mapBox"></div>
  <div class="q" id="qtxt"></div>
  <div class="write">✏️ 答えを、ノートに書こう</div>
  <button class="go" id="showBtn">答えを見る</button>
  <div id="reveal" hidden>
    <div class="ans"><small>正しい答え</small><div class="a" id="ans"></div><div class="n" id="ansn"></div></div>
    <p class="msg">ノートの答えは合っていた？</p>
    <div class="judge"><button class="ok" id="okBtn">正解</button><button class="ng" id="ngBtn">不正解</button></div>
  </div>
</section>

<section id="result" class="card" hidden>
  <div class="msg" id="rmsg"></div>
  <div class="big" id="rscore"></div>
  <p class="note" id="rfirst"></p>
  <ul class="miss" id="rmiss"></ul>
  <button class="go" id="retryBtn">不正解だった問題にもう一度</button>
  <button class="go sub" id="againBtn">さいしょからやる</button>
</section>
</main>

<script>
// 街道データ。p=略図上の経路(x,y)、c=色、note=解説
const R=[
 {n:"東海道",c:"#d94841",note:"日本橋から京都の三条大橋まで。宿場は「東海道五十三次」。",
  p:[[473,265],[463,290],[440,305],[407,316],[380,328],[350,339],[330,352],[310,362],[279,368],[245,345],[221,323],[201,330],[175,351],[137,334],[121,335]],b:[380,328]},
 {n:"中山道",c:"#2a7fba",note:"日本橋から山あいを通って、草津で東海道に合流する。宿場は「中山道六十九次」。",
  p:[[473,265],[468,257],[439,224],[405,197],[372,194],[324,224],[281,275],[269,290],[181,297],[169,304],[137,334]],b:[439,224]},
 {n:"日光道中(日光街道)",c:"#e08a00",note:"日本橋から日光東照宮へ向かう道。",
  p:[[473,265],[473,258],[468,222],[474,199],[482,172],[458,152]],b:[470,163]},
 {n:"奥州道中(奥州街道)",c:"#7b4fb3",note:"宇都宮で日光道中と分かれ、白河へ向かう道。",
  p:[[482,172],[494,140],[511,112]],b:[502,126]},
 {n:"甲州道中(甲州街道)",c:"#2a9d5c",note:"日本橋から甲府を通り、下諏訪で中山道に合流する。",
  p:[[473,265],[466,264],[422,270],[392,273],[367,267],[324,224]],b:[395,272]}
];
// 宿場町など [名前,x,y,配置,dx,dy]
const P=[["箱根",407,316,"end",-8,14],["府中",350,339,"end",-8,14],["袋井",310,362,"end",-8,14],["新居",279,368,"end",-8,16],
["宮",221,323,"start",8,-6],["桑名",201,330,"end",-8,-8],["関",175,351,"end",-8,14],["草津",137,334,"middle",0,18],
["高崎",405,197,"start",8,-6],["軽井沢",372,194,"middle",0,-10],["下諏訪",324,224,"end",-8,4],["妻籠",281,275,"end",-8,-8],["関ヶ原",181,297,"middle",0,-10],
["幸手",468,222,"start",8,4],["小山",474,199,"start",8,4],["宇都宮",482,172,"start",8,4],["日光",458,152,"end",-8,10],
["大田原",494,140,"end",-8,4],["白河",511,112,"start",8,4],["小仏",422,270,"middle",0,16],["甲府",367,267,"middle",0,16]];
const LAND="M0,250 L60,262 L120,268 L160,235 L190,200 L215,160 L235,140 L255,100 L285,100 L275,135 L300,160 L338,110 L400,40 L430,0 L582,0 L585,60 L572,110 L565,160 L546,190 L557,230 L568,260 L528,303 L494,336 L482,346 L478,320 L488,300 L502,282 L476,282 L463,298 L461,322 L440,322 L419,310 L412,325 L408,360 L392,378 L378,352 L383,324 L352,337 L336,378 L310,372 L290,373 L260,372 L233,378 L225,345 L212,332 L200,345 L185,368 L205,392 L215,420 L205,440 L0,440 Z";
// ことばの問題 [問題, 答え, ひとこと]
const T=[
["江戸幕府が整えた五街道を、すべて書こう。","東海道・中山道・日光道中(日光街道)・奥州道中(奥州街道)・甲州道中(甲州街道)","「〜道中」と「〜街道」の2通りの呼び方がある。どちらも書けるようにしよう。"],
["五街道の起点になった、江戸の橋の名前は？","日本橋","全国への道のりを測る、出発点だった。"],
["東海道の終点、京都にある橋の名前は？","三条大橋","江戸と京都を結ぶ、いちばん大事な道だった。"],
["街道ぞいにつくられ、旅人が泊まったり、人や馬を交代させたりした町を何という？","宿場町(宿場・宿駅)","東海道には53の宿場があり「五十三次」とよばれた。"],
["宿場町にあって、大名や幕府の役人などが泊まった、格の高い宿を何という？","本陣","ふつうの旅人は「旅籠(はたご)」に泊まった。"],
["「入り鉄砲に出女」を取りしまるために、街道の要所に置かれたものは？","関所","東海道の箱根・新居(あらい)の関所が有名。"],
["大名を1年おきに江戸と領地で暮らさせた制度は？ 制度にした将軍の名前もわかれば書こう。","参勤交代(3代将軍・徳川家光)","大名行列で街道がにぎわい、宿場町が発展した。"],
["歌川広重が、東海道の宿場の風景をえがいた浮世絵の連作は？","東海道五十三次","宿場町や名所をえがいた風景画が人気になった。"],
["日光道中の終点にある、徳川家康をまつった神社は？","日光東照宮","日光道中は、日本橋から日光東照宮へ向かう道。"],
["幕府が、五街道や宿場を管理するために置いた役職は？","道中奉行","五街道は、幕府が直接管理した大切な道だった。"]
];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const NUM="①②③④⑤";
let lab,queue,missed,total,firstCorrect,round,idx,roundCorrect;

function mapSVG(t){
  let s=`<svg viewBox="0 0 640 440" class="map" role="img" aria-label="五街道の略図"><path d="${LAND}" fill="#dff0c8" stroke="#1d3557" stroke-width="2"/><ellipse cx="150" cy="312" rx="9" ry="28" fill="#d6ecfa" stroke="#1d3557"/>`;
  s+=`<g font-size="13" fill="#5b7894"><text x="190" y="80">日本海</text><text x="500" y="400">太平洋</text><text x="162" y="308" font-size="11">琵琶湖</text></g>`;
  R.forEach((r,i)=>{const on=i===t;s+=`<polyline points="${r.p.map(q=>q.join(",")).join(" ")}" fill="none" stroke="${on?r.c:"#9aa9b8"}" stroke-width="${on?7:3}" stroke-linecap="round" stroke-linejoin="round"/>`});
  P.forEach(p=>{s+=`<circle cx="${p[1]}" cy="${p[2]}" r="4" fill="#fff" stroke="#1d3557" stroke-width="2"/><text x="${p[1]+p[4]}" y="${p[2]+p[5]}" text-anchor="${p[3]}" font-size="12" fill="#1d3557" stroke="#fff" stroke-width="3" paint-order="stroke">${p[0]}</text>`});
  s+=`<circle cx="473" cy="265" r="7" fill="#e63946" stroke="#1d3557" stroke-width="2"/><text x="482" y="262" font-size="14" font-weight="700" fill="#1d3557" stroke="#fff" stroke-width="3" paint-order="stroke">日本橋</text>`;
  s+=`<circle cx="121" cy="335" r="7" fill="#e63946" stroke="#1d3557" stroke-width="2"/><text x="112" y="322" text-anchor="end" font-size="14" font-weight="700" fill="#1d3557" stroke="#fff" stroke-width="3" paint-order="stroke">三条大橋</text>`;
  R.forEach((r,i)=>{s+=`<text x="${r.b[0]}" y="${r.b[1]+8}" text-anchor="middle" font-size="26" font-weight="700" fill="${i===t?"#e63946":"#1d3557"}" stroke="#fff" stroke-width="4" paint-order="stroke">${NUM[lab[i]]}</text>`});
  return s+"</svg>";
}

function show(id){["start","quiz","result"].forEach(s=>$(s).hidden=s!==id)}
function startAll(){
  lab=shuffle([0,1,2,3,4]);
  queue=shuffle(R.map((_,i)=>({m:1,i}))).concat(shuffle(T.map(t=>({m:0,q:t[0],a:t[1],n:t[2]}))));
  total=queue.length;firstCorrect=0;round=1;begin();
}
function begin(){idx=0;roundCorrect=0;missed=[];show("quiz");ask()}
const text=q=>q.m?"地図の"+NUM[lab[q.i]]+"の街道":q.q;
const answer=q=>q.m?R[q.i].n:q.a;

function ask(){
  const q=queue[idx];
  $("prog").textContent=(round>1?"もう一度 ":"")+(idx+1)+" / "+queue.length+" もん";
  $("score").textContent="正解 "+roundCorrect;
  $("tag").textContent=q.m?"地図の問題":"ことばの問題";
  $("mapBox").innerHTML=q.m?mapSVG(q.i):"";
  $("qtxt").textContent=q.m?NUM[lab[q.i]]+" の街道の名前は？(太い線の街道)":q.q;
  $("ans").textContent=answer(q);$("ansn").textContent=q.m?R[q.i].note:q.n;
  $("reveal").hidden=true;$("showBtn").hidden=false;$("showBtn").focus();
}
function judge(right){
  const q=queue[idx];
  if(right){roundCorrect++;if(round===1)firstCorrect++}else missed.push(q);
  idx++;idx<queue.length?ask():finish();
}
function finish(){
  show("result");
  const n=queue.length,r=roundCorrect/n;
  $("rscore").innerHTML=roundCorrect+" <small>/ "+n+" もん 正解</small>";
  $("rmsg").textContent=missed.length===0?(round===1?"ぜんぶ正解！ パーフェクト！":"ぜんぶ正解！ よくがんばったね！"):r>=.8?"おしい！ あとすこし！":r>=.5?"いい調子！ 不正解だったところを見なおそう":"ここからのびるよ！ もう一度やってみよう";
  $("rfirst").textContent=round>1?"1回目の正解: "+firstCorrect+" / "+total+" もん":"";
  const ul=$("rmiss");ul.innerHTML="";
  missed.forEach(q=>{const li=document.createElement("li");li.textContent=text(q)+" → "+answer(q);ul.appendChild(li)});
  $("retryBtn").hidden=missed.length===0;
}
$("startBtn").onclick=startAll;
$("showBtn").onclick=()=>{$("showBtn").hidden=true;$("reveal").hidden=false};
$("okBtn").onclick=()=>judge(true);
$("ngBtn").onclick=()=>judge(false);
$("retryBtn").onclick=()=>{queue=shuffle(missed);round++;begin()};
$("againBtn").onclick=startAll;
</script>
</body>
</html>
