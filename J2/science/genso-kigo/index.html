<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元素記号 単語帳40｜お母さんの愛AI</title>
<style>
:root{--ink:#1b2a41;--bg:#f3f6fa;--line:#c9d3e0;--acc:#2563eb;--ok:#15803d;--ng:#c2410c;--mute:#4a5b73}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;color:var(--ink);background:var(--bg);padding:16px;line-height:1.6}
main{max-width:520px;margin:0 auto}
h1{font-size:1.3rem;margin:8px 0 14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
fieldset{border:0;margin:0 0 12px;padding:0}
legend{font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips span{display:block;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:.95rem}
.chips input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.chips input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
button{font:inherit;cursor:pointer}
.go{display:block;width:100%;background:var(--acc);color:#fff;font-weight:700;font-size:1.05rem;padding:13px;border:0;border-radius:10px;margin-top:10px}
.go.sub{background:#fff;color:var(--acc);border:2px solid var(--acc)}
.go.flag{background:#fff;color:var(--ng);border:2px solid var(--ng)}
.go:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:.85rem;margin-top:8px;padding:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:10px;color:var(--mute)}
.card{position:relative;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:20px;cursor:pointer;user-select:none;box-shadow:0 4px 0 var(--line)}
.card.back{border-color:var(--ok);background:#f1faf4}
.card .tag{font-size:.85rem;color:var(--mute);margin-bottom:6px}
.card .main{font-size:3.6rem;font-weight:700;line-height:1.3;font-family:Arial,"Helvetica Neue",sans-serif}
.card .main.jp{font-family:inherit;font-size:2.8rem}
.card .sub{font-size:.95rem;color:var(--mute);margin-top:6px}
.card .hint{font-size:.85rem;color:var(--mute);margin-top:14px}
.mark{position:absolute;top:10px;right:12px;font-size:.85rem;font-weight:700;color:var(--ng)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.judge button{padding:13px;border:0;border-radius:10px;color:#fff;font-weight:700;font-size:1.05rem}
.judge .ok{background:var(--ok)}.judge .ng{background:var(--ng)}
.big{font-size:2.4rem;font-weight:700;text-align:center;margin:4px 0}.big small{font-size:1rem}
.msg{text-align:center;font-weight:700;margin:0 0 8px}
.note{font-size:.85rem;text-align:center;color:var(--mute);margin:10px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>元素記号 単語帳40</h1>

<section id="start" class="panel">
  <fieldset class="chips"><legend>出題</legend>
    <label><input type="radio" name="mode" value="s2n" checked><span>記号 → 名称</span></label>
    <label><input type="radio" name="mode" value="n2s"><span>名称 → 記号</span></label>
    <label><input type="radio" name="mode" value="both"><span>両方</span></label>
  </fieldset>
  <fieldset class="chips"><legend>範囲（原子番号）</legend>
    <label><input type="radio" name="range" value="0-999" checked><span>全部(40)</span></label>
    <label><input type="radio" name="range" value="1-10"><span>1〜10</span></label>
    <label><input type="radio" name="range" value="11-20"><span>11〜20</span></label>
    <label><input type="radio" name="range" value="24-47"><span>24〜47</span></label>
    <label><input type="radio" name="range" value="48-92"><span>48〜92</span></label>
  </fieldset>
  <fieldset class="chips"><legend>順番</legend>
    <label><input type="radio" name="order" value="rand" checked><span>ランダム</span></label>
    <label><input type="radio" name="order" value="seq"><span>原子番号順</span></label>
  </fieldset>
  <button class="go" id="startBtn">スタート</button>
  <button class="go flag" id="flagBtn">★ 印をつけたカードだけ復習（<span id="flagCount">0</span>枚）</button>
  <button class="link" id="clearBtn">印をすべて消す</button>
  <p class="note">カードをタップすると答えが出ます。「まちがえた」を押すと印がつき、あとで復習できます。印は、このブラウザに保存されます。</p>
</section>

<section id="study" class="panel" hidden>
  <div class="bar"><span id="prog"></span><span id="stat"></span></div>
  <div class="card" id="card" role="button" tabindex="0" aria-live="polite">
    <span class="mark" id="mark" hidden>★ 印あり</span>
    <div class="tag" id="tag"></div>
    <div class="main" id="main"></div>
    <div class="sub" id="subt"></div>
    <div class="hint" id="hint">タップして答えを見る</div>
  </div>
  <div class="judge" id="judge" hidden>
    <button class="ng" id="ngBtn">まちがえた（印）</button>
    <button class="ok" id="okBtn">わかった</button>
  </div>
  <p class="note">パソコン: スペースで答え、1 で「まちがえた」、2 で「わかった」</p>
</section>

<section id="result" class="panel" hidden>
  <div class="msg" id="rmsg"></div>
  <div class="big" id="rscore"></div>
  <p class="note" id="rflag"></p>
  <button class="go flag" id="reviewBtn">★ 印をつけたカードを復習</button>
  <button class="go sub" id="againBtn">最初にもどる</button>
</section>
</main>

<script>
// [原子番号, 元素記号, 名称]
const E=[
[1,"H","水素"],[2,"He","ヘリウム"],[3,"Li","リチウム"],[4,"Be","ベリリウム"],[5,"B","ホウ素"],
[6,"C","炭素"],[7,"N","窒素"],[8,"O","酸素"],[9,"F","フッ素"],[10,"Ne","ネオン"],
[11,"Na","ナトリウム"],[12,"Mg","マグネシウム"],[13,"Al","アルミニウム"],[14,"Si","ケイ素"],[15,"P","リン"],
[16,"S","硫黄"],[17,"Cl","塩素"],[18,"Ar","アルゴン"],[19,"K","カリウム"],[20,"Ca","カルシウム"],
[24,"Cr","クロム"],[25,"Mn","マンガン"],[26,"Fe","鉄"],[27,"Co","コバルト"],[28,"Ni","ニッケル"],
[29,"Cu","銅"],[30,"Zn","亜鉛"],[33,"As","ヒ素"],[35,"Br","臭素"],[47,"Ag","銀"],
[48,"Cd","カドミウム"],[50,"Sn","スズ"],[53,"I","ヨウ素"],[54,"Xe","キセノン"],[56,"Ba","バリウム"],
[78,"Pt","白金"],[79,"Au","金"],[80,"Hg","水銀"],[82,"Pb","鉛"],[92,"U","ウラン"]
];
const KEY="element-flags-v1";
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const val=n=>document.querySelector('input[name="'+n+'"]:checked').value;
const cid=c=>c.e[0]+":"+c.d;

// 印の保存(ブラウザのlocalStorage。使えない環境ではこのページを開いている間だけ有効)
let flags=new Set();
try{flags=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify([...flags]))}catch(e){}}

let deck,i,flipped,known,reviewMode;
const allCards=()=>E.flatMap(e=>[{e,d:"s2n"},{e,d:"n2s"}]);

function show(id){["start","study","result"].forEach(s=>$(s).hidden=s!==id);if(id==="start")refresh()}
function refresh(){$("flagCount").textContent=flags.size;$("flagBtn").disabled=flags.size===0}

function begin(cards,review){
  reviewMode=review;
  deck=val("order")==="seq"&&!review?cards.slice().sort((a,b)=>a.e[0]-b.e[0]||(a.d<b.d?1:-1)):shuffle(cards);
  i=0;known=0;show("study");render();
}
function startNormal(){
  const [lo,hi]=val("range").split("-").map(Number),m=val("mode");
  begin(allCards().filter(c=>c.e[0]>=lo&&c.e[0]<=hi&&(m==="both"||c.d===m)),false);
}
function startReview(){
  const c=allCards().filter(c=>flags.has(cid(c)));
  if(c.length)begin(c,true);
}

function render(){
  const c=deck[i];flipped=false;
  $("prog").textContent=(reviewMode?"復習 ":"")+(i+1)+" / "+deck.length;
  $("stat").textContent="わかった "+known+"　★ "+flags.size;
  $("card").classList.remove("back");
  $("tag").textContent=c.d==="s2n"?"元素記号 → 名称":"名称 → 元素記号";
  const m=$("main");m.textContent=c.d==="s2n"?c.e[1]:c.e[2];m.className="main"+(c.d==="s2n"?"":" jp");
  $("subt").textContent="";$("hint").hidden=false;$("judge").hidden=true;
  $("mark").hidden=!flags.has(cid(c));
}
function flip(){
  if(flipped)return;flipped=true;
  const c=deck[i];
  $("card").classList.add("back");
  $("tag").textContent="答え";
  const m=$("main");m.textContent=c.d==="s2n"?c.e[2]:c.e[1];m.className="main"+(c.d==="s2n"?" jp":"");
  $("subt").textContent=(c.d==="s2n"?"記号 "+c.e[1]+"　":"")+"原子番号 "+c.e[0];
  $("hint").hidden=true;$("judge").hidden=false;
}
function judge(good){
  if(!flipped)return;
  const id=cid(deck[i]);
  if(good){known++;flags.delete(id)}else flags.add(id);
  save();i++;i<deck.length?render():finish();
}
function finish(){
  show("result");
  $("rmsg").textContent=flags.size===0?"印はゼロ！ よく覚えました":"おつかれさま！ 印のカードを復習しよう";
  $("rscore").innerHTML=known+" <small>/ "+deck.length+" わかった</small>";
  $("rflag").textContent="印のカード: "+flags.size+"枚";
  $("reviewBtn").hidden=flags.size===0;
}

$("startBtn").onclick=startNormal;
$("flagBtn").onclick=startReview;
$("reviewBtn").onclick=startReview;
$("againBtn").onclick=()=>show("start");
$("clearBtn").onclick=()=>{if(flags.size&&confirm("印をすべて消しますか？")){flags.clear();save();refresh()}};
$("card").onclick=flip;
$("okBtn").onclick=()=>judge(true);
$("ngBtn").onclick=()=>judge(false);
document.addEventListener("keydown",e=>{
  if($("study").hidden)return;
  if((e.key===" "||e.key==="Enter")&&e.target.tagName!=="BUTTON"){e.preventDefault();flip()}
  else if(e.key==="1")judge(false);else if(e.key==="2")judge(true);
});
refresh();
</script>
</body>
</html>
